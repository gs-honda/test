<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT BAG チョコレートミント | FRUTTI DI BOSCO 広告アニメーション</title>
<style>
  :root{
    --cacao:#1c110b;
    --choco:#3a2418;
    --mint:#3fd2c2;
    --mint-soft:#8ce8dd;
    --gold:#c9a86a;
    --cream:#f4ece1;
    --t:28s; /* 1ループの長さ */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 120% at 50% 0%, #2a1a10 0%, var(--cacao) 60%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:28px 16px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    color:var(--cream);
    min-height:100vh;
  }

  /* ===== ステージ（1:1 / Metaフィード比率） ===== */
  .stage{
    position:relative;
    width:min(92vw,600px);
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:6px;
    background:#120a06;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,106,.18);
    isolation:isolate;
  }
  .stage:hover .anim, .stage:hover .anim::before{animation-play-state:paused;}

  .scene{
    position:absolute;inset:0;
    opacity:0;
  }
  .scene img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    will-change:transform;
  }
  .shade{position:absolute;inset:0;pointer-events:none;}

  /* ===== シーン表示タイミング（28s = 各シーン7s） ===== */
  .s1{animation:show1 var(--t) ease-in-out infinite;}
  .s2{animation:show2 var(--t) ease-in-out infinite;}
  .s3{animation:show3 var(--t) ease-in-out infinite;}
  .s4{animation:show4 var(--t) ease-in-out infinite;}
  @keyframes show1{0%{opacity:0}3%{opacity:1}21.5%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes show2{0%,21.5%{opacity:0}25%{opacity:1}46.5%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes show3{0%,46.5%{opacity:0}50%{opacity:1}71.5%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes show4{0%,71.5%{opacity:0}75%{opacity:1}96.5%{opacity:1}100%{opacity:0}}

  /* ===== ケンバーンズ（ゆっくりズーム） ===== */
  .s1 img{animation:kb1 var(--t) ease-in-out infinite;}
  .s2 img{animation:kb2 var(--t) ease-in-out infinite;}
  .s3 img{animation:kb3 var(--t) ease-in-out infinite;}
  .s4 img{animation:kb4 var(--t) ease-in-out infinite;}
  @keyframes kb1{0%{transform:scale(1.14) translate(2%,-1%)}25%{transform:scale(1.0)}100%{transform:scale(1.14) translate(2%,-1%)}}
  @keyframes kb2{0%,21.5%{transform:scale(1.0)}50%{transform:scale(1.16) translate(-2%,2%)}100%{transform:scale(1.0)}}
  @keyframes kb3{0%,46.5%{transform:scale(1.15) translate(-2%,0)}75%{transform:scale(1.0)}100%{transform:scale(1.15) translate(-2%,0)}}
  @keyframes kb4{0%,71.5%{transform:scale(1.0)}100%{transform:scale(1.1) translate(1.5%,-1.5%)}}

  /* ===== テキスト共通 ===== */
  .copy{position:absolute;z-index:3;}
  .eyebrow{
    font-family:Didot,"Bodoni MT","Cormorant Garamond",Georgia,serif;
    font-size:clamp(10px,2vw,12px);
    letter-spacing:.42em;
    color:var(--mint-soft);
    text-transform:uppercase;
  }
  .headline{
    font-size:clamp(20px,4.6vw,30px);
    font-weight:600;
    line-height:1.7;
    color:var(--cream);
    text-shadow:0 2px 24px rgba(0,0,0,.55);
  }
  .sub{
    font-size:clamp(12px,2.4vw,14.5px);
    letter-spacing:.14em;
    color:rgba(244,236,225,.85);
  }

  /* パイピングを思わせるミントの罫線（シグネチャ・モチーフ） */
  .pipe{
    height:1.5px;background:linear-gradient(90deg,var(--mint),var(--mint-soft));
    transform-origin:left center;border-radius:2px;
    box-shadow:0 0 10px rgba(63,210,194,.55);
  }

  /* ===== Scene 1：ブランド＆オープニング ===== */
  .s1 .shade{background:linear-gradient(to top, rgba(18,10,6,.82) 0%, rgba(18,10,6,.18) 45%, rgba(18,10,6,.25) 100%);}
  .c1{left:7%;bottom:9%;right:7%;}
  .c1 .eyebrow{animation:rise var(--t) ease-out infinite;animation-delay:0s;}
  .c1 .pipe{width:64px;margin:12px 0 14px;animation:pipe1 var(--t) ease-in-out infinite;}
  .c1 .headline{animation:rise2 var(--t) ease-out infinite;}
  @keyframes rise{0%,2.5%{opacity:0;transform:translateY(14px)}5.5%{opacity:1;transform:none}21%{opacity:1}24%{opacity:0}100%{opacity:0}}
  @keyframes pipe1{0%,4%{transform:scaleX(0);opacity:0}5%{opacity:1}8%{transform:scaleX(1)}21%{opacity:1;transform:scaleX(1)}24%{opacity:0}100%{opacity:0;transform:scaleX(0)}}
  @keyframes rise2{0%,5%{opacity:0;transform:translateY(16px)}9%{opacity:1;transform:none}21%{opacity:1}24%{opacity:0}100%{opacity:0}}

  /* ===== Scene 2：ディテール ===== */
  .s2 .shade{background:linear-gradient(160deg, rgba(18,10,6,.72) 0%, rgba(18,10,6,.1) 48%, transparent 70%);}
  .c2{left:7%;top:8%;right:30%;}
  .c2 .eyebrow{animation:d2a var(--t) ease-out infinite;}
  .c2 .pipe{width:48px;margin:12px 0 14px;animation:d2p var(--t) ease-in-out infinite;}
  .c2 .headline{font-size:clamp(17px,3.8vw,25px);animation:d2b var(--t) ease-out infinite;}
  .c2 .sub{margin-top:12px;animation:d2c var(--t) ease-out infinite;}
  @keyframes d2a{0%,26%{opacity:0;transform:translateY(12px)}29%{opacity:1;transform:none}46%{opacity:1}49.5%{opacity:0}100%{opacity:0}}
  @keyframes d2p{0%,27.5%{transform:scaleX(0);opacity:0}28.5%{opacity:1}31.5%{transform:scaleX(1)}46%{opacity:1;transform:scaleX(1)}49.5%{opacity:0}100%{opacity:0;transform:scaleX(0)}}
  @keyframes d2b{0%,28.5%{opacity:0;transform:translateY(14px)}32%{opacity:1;transform:none}46%{opacity:1}49.5%{opacity:0}100%{opacity:0}}
  @keyframes d2c{0%,31%{opacity:0;transform:translateY(12px)}34.5%{opacity:1;transform:none}46%{opacity:1}49.5%{opacity:0}100%{opacity:0}}

  /* ===== Scene 3：2WAY（縦書きキャプション） ===== */
  .s3 .shade{background:linear-gradient(to right, transparent 40%, rgba(18,10,6,.66) 100%);}
  .c3{right:7%;top:9%;bottom:9%;display:flex;gap:16px;align-items:flex-start;}
  .tate{
    writing-mode:vertical-rl;
    font-size:clamp(18px,4vw,26px);
    font-weight:600;line-height:2;
    letter-spacing:.18em;
    color:var(--cream);
    text-shadow:0 2px 22px rgba(0,0,0,.6);
  }
  .tate.small{font-size:clamp(12px,2.6vw,15px);font-weight:400;color:rgba(244,236,225,.85);letter-spacing:.3em;}
  .pipe-v{
    width:1.5px;background:linear-gradient(180deg,var(--mint),var(--mint-soft));
    transform-origin:top center;border-radius:2px;align-self:stretch;
    box-shadow:0 0 10px rgba(63,210,194,.55);
    animation:d3p var(--t) ease-in-out infinite;
  }
  .c3 .tate:not(.small){animation:d3a var(--t) ease-out infinite;}
  .c3 .tate.small{animation:d3b var(--t) ease-out infinite;}
  @keyframes d3a{0%,52.5%{opacity:0;transform:translateX(14px)}56%{opacity:1;transform:none}71%{opacity:1}74.5%{opacity:0}100%{opacity:0}}
  @keyframes d3b{0%,55%{opacity:0;transform:translateX(12px)}58.5%{opacity:1;transform:none}71%{opacity:1}74.5%{opacity:0}100%{opacity:0}}
  @keyframes d3p{0%,52%{transform:scaleY(0);opacity:0}53%{opacity:1}57%{transform:scaleY(1)}71%{opacity:1;transform:scaleY(1)}74.5%{opacity:0}100%{opacity:0;transform:scaleY(0)}}

  /* ===== Scene 4：商品名・価格・CTA ===== */
  .s4 .shade{background:linear-gradient(to top, rgba(18,10,6,.88) 0%, rgba(18,10,6,.25) 50%, transparent 75%);}
  .c4{left:7%;right:7%;bottom:8%;text-align:left;}
  .pname{
    font-family:Didot,"Bodoni MT","Cormorant Garamond",Georgia,serif;
    font-size:clamp(30px,7vw,46px);
    letter-spacing:.14em;color:var(--cream);
    line-height:1.1;
    animation:d4a var(--t) ease-out infinite;
  }
  .pname span{color:var(--mint);}
  .pdesc{margin-top:10px;font-size:clamp(12px,2.6vw,15px);letter-spacing:.2em;color:rgba(244,236,225,.9);animation:d4b var(--t) ease-out infinite;}
  .prow{margin-top:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;animation:d4c var(--t) ease-out infinite;}
  .price{font-family:Didot,"Bodoni MT",Georgia,serif;font-size:clamp(16px,3.6vw,21px);letter-spacing:.08em;color:var(--gold);}
  .price small{font-size:.62em;letter-spacing:.12em;color:rgba(201,168,106,.85);}
  .cta{
    display:inline-block;padding:10px 22px;
    border:1px solid var(--mint);border-radius:999px;
    font-size:clamp(11px,2.4vw,13px);letter-spacing:.26em;
    color:var(--mint-soft);
    background:rgba(63,210,194,.07);
    animation:d4c var(--t) ease-out infinite, glow calc(var(--t)/14) ease-in-out infinite alternate;
  }
  @keyframes d4a{0%,77%{opacity:0;transform:translateY(16px)}81%{opacity:1;transform:none}96%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
  @keyframes d4b{0%,79%{opacity:0;transform:translateY(14px)}83%{opacity:1;transform:none}96%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
  @keyframes d4c{0%,81%{opacity:0;transform:translateY(12px)}85%{opacity:1;transform:none}96%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
  @keyframes glow{from{box-shadow:0 0 0 rgba(63,210,194,0)}to{box-shadow:0 0 22px rgba(63,210,194,.35)}}

  /* ===== 常時表示：ロゴとプログレスバー ===== */
  .brandmark{
    position:absolute;top:6.5%;left:0;right:0;z-index:4;
    text-align:center;
    font-family:Didot,"Bodoni MT","Cormorant Garamond",Georgia,serif;
    font-size:clamp(11px,2.2vw,13px);
    letter-spacing:.52em;text-indent:.52em;
    color:rgba(244,236,225,.92);
    text-shadow:0 1px 14px rgba(0,0,0,.6);
    animation:brandfade var(--t) ease-in-out infinite;
  }
  @keyframes brandfade{0%{opacity:0}3%{opacity:1}24%{opacity:1}27%{opacity:.55}96.5%{opacity:.55}100%{opacity:0}}
  .progress{
    position:absolute;left:0;bottom:0;height:2px;z-index:5;
    background:linear-gradient(90deg,var(--mint),var(--mint-soft));
    width:100%;transform-origin:left center;
    animation:prog var(--t) linear infinite;
    box-shadow:0 0 8px rgba(63,210,194,.5);
  }
  @keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* 粒子のようなフィルムグレイン風オーバーレイ（ごく薄く） */
  .grain{
    position:absolute;inset:-50%;z-index:2;pointer-events:none;opacity:.05;
    background-image:repeating-conic-gradient(rgba(255,255,255,.6) 0% .0001%, transparent .0002% .0004%);
    animation:grain 1.4s steps(4) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}25%{transform:translate(-2%,1.5%)}
    50%{transform:translate(1.5%,-2%)}75%{transform:translate(-1%,-1%)}100%{transform:translate(0,0)}
  }

  /* ===== ページ側の注記 ===== */
  .note{
    font-size:12px;letter-spacing:.2em;color:rgba(244,236,225,.5);
    text-align:center;line-height:2;
  }
  .note b{color:var(--mint-soft);font-weight:400;}

  /* ===== モーション低減設定への配慮 ===== */
  @media (prefers-reduced-motion: reduce){
    .anim, .anim::before, .scene img{animation:none !important;}
    .scene{opacity:0;}
    .s4{opacity:1;}
    .s4 .copy, .s4 .copy *{animation:none !important;opacity:1 !important;transform:none !important;}
    .brandmark{animation:none;opacity:1;}
    .progress,.grain{display:none;}
  }
</style>
</head>
