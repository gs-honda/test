<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たしざん</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rounded Mplus 1c', sans-serif;
  background: linear-gradient(135deg, #ffecd2, #fcb69f, #a1c4fd, #c2e9fb);
  background-size: 400% 400%;
  animation: bgMove 8s ease infinite;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}
@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.question {
  font-size: min(20vw, 120px);
  font-weight: bold;
  color: #333;
  text-align: center;
  margin-bottom: 30px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

.choices {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  max-width: 500px;
  padding: 0 20px;
}

.choice-btn {
  width: min(22vw, 100px);
  height: min(22vw, 100px);
  border-radius: 50%;
  border: 4px solid #fff;
  font-size: min(10vw, 48px);
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  transition: transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.choice-btn:active { transform: scale(0.9); }

.result {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: min(30vw, 180px);
  z-index: 10;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.result.show { opacity: 1; pointer-events: auto; }
.result.correct { background: rgba(76, 175, 80, 0.92); }
.result.wrong { background: rgba(244, 67, 54, 0.88); }
.result-sub {
  font-size: min(8vw, 36px);
  color: #fff;
  margin-top: 10px;
}

.score {
  position: fixed;
  top: 16px;
  right: 20px;
  font-size: min(6vw, 28px);
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,0.25);
  padding: 8px 18px;
  border-radius: 30px;
}

.stars {
  position: fixed;
  top: 16px;
  left: 20px;
  font-size: min(7vw, 32px);
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="score" id="score">0 てん</div>
<div class="question" id="question"></div>
<div class="choices" id="choices"></div>
<div class="result" id="result">
  <span id="resultEmoji"></span>
  <div class="result-sub" id="resultSub"></div>
</div>

<script>
const COLORS = ['#e74c3c','#e67e22','#2ecc71','#3498db','#9b59b6','#1abc9c','#f39c12','#e84393','#00b894'];
let score = 0;
let streak = 0;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateQuestion() {
  // 答えが2〜9、各数字が1以上
  const answer = rand(2, 9);
  const a = rand(1, answer - 1);
  const b = answer - a;
  return { a, b, answer };
}

function generateChoices(answer) {
  const set = new Set([answer]);
  while (set.size < 4) {
    // 1〜9の中からダミーを選ぶ
    set.add(rand(1, 9));
  }
  return shuffle([...set]);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showQuestion() {
  const q = generateQuestion();
  const questionEl = document.getElementById('question');
  questionEl.textContent = `${q.a} + ${q.b} = ?`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const choices = generateChoices(q.answer);

  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.style.background = COLORS[i % COLORS.length];
    btn.onclick = () => checkAnswer(c, q.answer);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(selected, answer) {
  const resultEl = document.getElementById('result');
  const emojiEl = document.getElementById('resultEmoji');
  const subEl = document.getElementById('resultSub');

  if (selected === answer) {
    score++;
    streak++;
    resultEl.className = 'result correct show';
    emojiEl.textContent = streak >= 3 ? '🎉' : '⭕';
    subEl.textContent = streak >= 3 ? `${streak}れんぞく せいかい！` : 'せいかい！';
    updateStars();
  } else {
    streak = 0;
    resultEl.className = 'result wrong show';
    emojiEl.textContent = '❌';
    subEl.textContent = `こたえは ${answer} だよ`;
    updateStars();
  }

  document.getElementById('score').textContent = `${score} てん`;

  setTimeout(() => {
    resultEl.className = 'result';
    showQuestion();
  }, selected === answer ? 1200 : 2000);
}

function updateStars() {
  const el = document.getElementById('stars');
  const count = Math.min(streak, 5);
  el.textContent = '⭐'.repeat(count);
}

showQuestion();
</script>
</body>
</html>
