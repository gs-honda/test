<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一括文字起こし — 商品ページ画像テキスト抽出</title>
<style>
  :root {
    --paper: #f7f6f2;
    --ink: #21241f;
    --ink-soft: #6b6f66;
    --rule: #d8d6cd;
    --shu: #c4452c;
    --shu-soft: #f3e0da;
    --scan: #2c6e63;
    --mono: "SFMono-Regular", "Consolas", "Hiragino Kaku Gothic ProN", monospace;
    --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 28px;
    flex-wrap: wrap; gap: 8px;
  }
  h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: .12em; }
  h1 .accent { color: var(--shu); }
  header small { color: var(--ink-soft); font-size: 12px; letter-spacing: .06em; }

  h2.step {
    font-family: var(--serif); font-size: 15px; font-weight: 600;
    letter-spacing: .15em; border-left: 4px solid var(--shu);
    padding-left: 10px; margin: 28px 0 10px;
  }
  h2.step:first-of-type { margin-top: 0; }

  textarea.snippet {
    width: 100%; min-height: 150px; padding: 14px 16px;
    font-family: var(--mono); font-size: 12px; line-height: 1.7;
    color: var(--ink); border: 1.5px solid var(--rule); border-radius: 6px;
    background: #fff; resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }

  .controls { display: flex; align-items: center; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
  select, button, input[type=password] {
    font-family: var(--sans); font-size: 14px;
    padding: 9px 16px; border-radius: 4px;
    border: 1.5px solid var(--ink);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  input[type=password] { cursor: text; font-family: var(--mono); font-size: 12px; }
  select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--shu); outline-offset: 2px;
  }
  button.primary { background: var(--ink); color: var(--paper); letter-spacing: .08em; }
  button.primary:hover:not(:disabled) { background: #000; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { border-color: var(--rule); color: var(--ink-soft); }
  button.ghost:hover { border-color: var(--ink); color: var(--ink); }

  .status { font-size: 13px; color: var(--ink-soft); font-family: var(--mono); min-height: 1.2em; }
  .status.err { color: var(--shu); }

  /* ---- URLリスト ---- */
  .urllist { list-style: none; display: none; flex-direction: column; gap: 6px; }
  .urllist.on { display: flex; }
  .urllist li {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1.5px solid var(--rule); border-radius: 6px;
    padding: 8px 12px;
    transition: border-color .2s;
  }
  .urllist li.working { border-color: var(--scan); }
  .urllist li.done { border-color: var(--rule); }
  .urllist li.error { border-color: var(--shu); }
  .urllist img {
    width: 56px; height: 56px; object-fit: cover; border-radius: 4px;
    background: var(--paper); flex-shrink: 0;
  }
  .urllist .name {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .urllist .state { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); flex-shrink: 0; }
  .urllist li.working .state { color: var(--scan); }
  .urllist li.done .state { color: var(--scan); }
  .urllist li.error .state { color: var(--shu); }
  .urllist input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--shu); cursor: pointer; }

  .keyrow { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; }
  .keyrow label { font-size: 12px; color: var(--ink-soft); }
  .keyrow input { width: 300px; max-width: 100%; }
  .keyrow .note { font-size: 11px; color: var(--ink-soft); }

  .result-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 28px 0 8px; flex-wrap: wrap; gap: 8px;
  }
  .result-head h2 {
    font-family: var(--serif); font-size: 15px; font-weight: 600;
    letter-spacing: .15em; border-left: 4px solid var(--shu); padding-left: 10px;
    margin: 0;
  }
  .result-head .meta { font-size: 12px; color: var(--ink-soft); font-family: var(--mono); }
  textarea.output {
    width: 100%; min-height: 320px; padding: 18px 20px;
    font-family: var(--mono); font-size: 14px; line-height: 2;
    color: var(--ink); border: 1.5px solid var(--rule); border-radius: 6px;
    resize: vertical;
    background:
      #fff linear-gradient(transparent calc(2em - 1px), var(--shu-soft) calc(2em - 1px), var(--shu-soft) 2em, transparent 2em);
    background-size: 100% 2em;
    background-attachment: local;
  }
  .result-actions { display: flex; gap: 10px; margin-top: 12px; }

  footer {
    margin-top: 48px; font-size: 11px; color: var(--ink-soft);
    letter-spacing: .05em; border-top: 1px solid var(--rule); padding-top: 12px;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>一括文字起<span class="accent">こ</span>し</h1>
    <small>HTMLスニペット内の画像をまとめてテキスト抽出</small>
  </header>

  <h2 class="step">① HTMLスニペットを貼り付け</h2>
  <textarea class="snippet" id="snippet" placeholder="&lt;img src=&quot;...&quot;&gt; を含むHTMLをここに貼り付けてください。画像URLの直接貼り付け（1行1URL）でも構いません。" spellcheck="false"></textarea>
  <div class="controls">
    <button class="primary" id="extract">画像URLを抽出</button>
    <span class="status" id="ex-status"></span>
  </div>

  <h2 class="step" id="step2" style="display:none">② 対象を確認して実行</h2>
  <ul class="urllist" id="urllist"></ul>
  <div class="controls" id="runrow" style="display:none">
    <label for="mode" style="font-size:13px;color:var(--ink-soft)">出力</label>
    <select id="mode">
      <option value="plain" selected>テキストのみ（レイアウト維持）</option>
      <option value="markdown">Markdown（表・見出しを構造化）</option>
      <option value="copywriting">テキスト＋画像の内容説明（alt文案）</option>
    </select>
    <button class="primary" id="run">一括読み取り</button>
    <button class="ghost" id="stop" style="display:none">中断</button>
    <span class="status" id="status"></span>
  </div>
  <div class="keyrow" id="keyrow" style="display:none">
    <label for="apikey">APIキー（任意）</label>
    <input type="password" id="apikey" placeholder="sk-ant-...（ローカルで開く場合のみ）" autocomplete="off">
    <span class="note">Claude.ai 内で使う場合は空欄のまま。キーは保存されません。</span>
  </div>

  <div class="result-head" id="resulthead" style="display:none">
    <h2>抽出結果</h2>
    <span class="meta" id="meta"></span>
  </div>
  <textarea class="output" id="output" style="display:none" spellcheck="false"></textarea>
  <div class="result-actions" id="resultactions" style="display:none">
    <button class="ghost" id="copy">コピー</button>
    <button class="ghost" id="download">.txt 保存</button>
  </div>

  <footer>
    画像URLは Anthropic API に直接渡され、サーバー側で取得・解析されます（公開URLである必要があります）。<br>
    順次処理のため、画像10枚で1〜2分程度かかります。&lt;video&gt; タグは自動的にスキップされます。
  </footer>
</div>

<script>
(() => {
  const snippet = document.getElementById('snippet');
  const extractBtn = document.getElementById('extract');
  const exStatus = document.getElementById('ex-status');
  const step2 = document.getElementById('step2');
  const urllist = document.getElementById('urllist');
  const runrow = document.getElementById('runrow');
  const keyrow = document.getElementById('keyrow');
  const runBtn = document.getElementById('run');
  const stopBtn = document.getElementById('stop');
  const modeSel = document.getElementById('mode');
  const keyInput = document.getElementById('apikey');
  const statusEl = document.getElementById('status');
  const output = document.getElementById('output');
  const meta = document.getElementById('meta');

  let items = [];   // { url, name, li, checkbox, stateEl }
  let aborted = false;
  let busy = false;

  const IMG_EXT = /\.(jpe?g|png|gif|webp)(\?|$)/i;

  function fileName(url) {
    try { return new URL(url).pathname.split('/').pop(); }
    catch { return url.slice(-40); }
  }

  // ---- ① 抽出 ----
  extractBtn.addEventListener('click', () => {
    const text = snippet.value;
    if (!text.trim()) { exStatus.textContent = 'スニペットを貼り付けてください'; return; }

    const urls = [];
    const seen = new Set();

    // img src属性から
    const srcRe = /<img[^>]*\ssrc\s*=\s*["']([^"']+)["']/gi;
    let m;
    while ((m = srcRe.exec(text)) !== null) {
      if (!seen.has(m[1])) { seen.add(m[1]); urls.push(m[1]); }
    }
    // 裸のURL（1行1URL貼り付け対応）— imgタグが見つからなかった場合のみ
    if (urls.length === 0) {
      const urlRe = /https?:\/\/[^\s"'<>]+/g;
      while ((m = urlRe.exec(text)) !== null) {
        if (IMG_EXT.test(m[0]) && !seen.has(m[0])) { seen.add(m[0]); urls.push(m[0]); }
      }
    }

    const videoCount = (text.match(/<video/gi) || []).length;

    if (urls.length === 0) {
      exStatus.textContent = '画像URLが見つかりませんでした';
      return;
    }

    // リスト構築
    urllist.innerHTML = '';
    items = urls.map(url => {
      const li = document.createElement('li');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = true;
      const img = document.createElement('img');
      img.src = url; img.loading = 'lazy'; img.alt = '';
      const name = document.createElement('span');
      name.className = 'name'; name.textContent = fileName(url); name.title = url;
      const state = document.createElement('span');
      state.className = 'state'; state.textContent = '待機';
      li.append(cb, img, name, state);
      urllist.appendChild(li);
      return { url, name: fileName(url), li, checkbox: cb, stateEl: state };
    });

    urllist.classList.add('on');
    step2.style.display = '';
    runrow.style.display = '';
    keyrow.style.display = '';
    exStatus.textContent = `${urls.length} 枚の画像を検出` +
      (videoCount ? `（動画 ${videoCount} 件はスキップ）` : '');
  });

  // ---- ② 一括実行 ----
  const PROMPTS = {
    plain: '画像内のすべてのテキストを抽出してください。元のレイアウト（改行・並び順）をできるだけ維持してください。抽出したテキストのみを出力し、説明や前置きは一切不要です。テキストが存在しない場合は「（テキストなし）」とだけ出力してください。',
    markdown: '画像内のすべてのテキストを抽出し、Markdownで構造化してください。表はMarkdownテーブル、見出しは見出し記法を使ってください。抽出結果のみを出力し、前置きやコードブロック記号は不要です。テキストがない場合は「（テキストなし）」とだけ出力してください。',
    copywriting: '商品ページ用の画像です。(1)画像内のテキストをすべて抽出し、(2)その後に「【画像内容】」として画像が何を見せているか（商品のどの部分・シーン・質感など）を1〜2文で説明してください。前置きは不要です。'
  };

  async function recognizeOne(url, prompt) {
    const headers = { 'Content-Type': 'application/json' };
    const userKey = keyInput.value.trim();
    if (userKey) {
      headers['x-api-key'] = userKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'url', url } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });
    if (!response.ok) {
      const errBody = await response.json().catch(() => null);
      throw new Error(errBody?.error?.message || `HTTP ${response.status}`);
    }
    const data = await response.json();
    return data.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  }

  runBtn.addEventListener('click', async () => {
    if (busy) return;
    const targets = items.filter(it => it.checkbox.checked);
    if (targets.length === 0) { statusEl.textContent = '対象が選択されていません'; return; }

    busy = true;
    aborted = false;
    runBtn.disabled = true;
    stopBtn.style.display = '';
    output.style.display = '';
    document.getElementById('resulthead').style.display = '';
    document.getElementById('resultactions').style.display = '';
    output.value = '';
    meta.textContent = '';
    const prompt = PROMPTS[modeSel.value];
    const t0 = performance.now();
    let okCount = 0, ngCount = 0;

    for (let i = 0; i < targets.length; i++) {
      if (aborted) break;
      const it = targets[i];
      it.li.classList.add('working');
      it.stateEl.textContent = '読み取り中…';
      statusEl.textContent = `処理中 ${i + 1} / ${targets.length}`;

      try {
        const text = await recognizeOne(it.url, prompt);
        it.li.classList.remove('working');
        it.li.classList.add('done');
        it.stateEl.textContent = '完了';
        okCount++;
        output.value += `────── ${it.name} ──────\n${text}\n\n`;
      } catch (err) {
        it.li.classList.remove('working');
        it.li.classList.add('error');
        it.stateEl.textContent = 'エラー';
        it.stateEl.title = err.message;
        ngCount++;
        output.value += `────── ${it.name} ──────\n（読み取り失敗: ${err.message}）\n\n`;
      }
      output.scrollTop = output.scrollHeight;
    }

    const sec = ((performance.now() - t0) / 1000).toFixed(0);
    statusEl.textContent = aborted ? '中断しました' : '完了';
    meta.textContent = `成功 ${okCount} ／ 失敗 ${ngCount} ／ ${sec} 秒`;
    busy = false;
    runBtn.disabled = false;
    stopBtn.style.display = 'none';
  });

  stopBtn.addEventListener('click', () => { aborted = true; });

  // ---- 結果操作 ----
  document.getElementById('copy').addEventListener('click', async () => {
    if (!output.value) return;
    await navigator.clipboard.writeText(output.value);
    statusEl.textContent = 'クリップボードにコピーしました';
  });
  document.getElementById('download').addEventListener('click', () => {
    if (!output.value) return;
    const blob = new Blob([output.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'extracted-texts.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
